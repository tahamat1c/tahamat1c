<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39d353" stop-opacity=".4"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="0" y="0" width="900" height="280" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- card background -->
    <rect width="900" height="280" fill="url(#cardBg)"/>

    <!-- left accent bar (animated height) -->
    <rect x="0" y="0" width="4" height="280" fill="url(#accentBar)">
      <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- background glow -->
    <circle cx="780" cy="140" r="120" fill="url(#badgeGlow)"/>

    <!-- corner brackets (HUD) -->
    <g stroke="#39d353" stroke-width="2" fill="none" opacity=".7">
      <path d="M 20 30 L 20 20 L 30 20"/>
      <path d="M 880 30 L 880 20 L 870 20"/>
      <path d="M 20 250 L 20 260 L 30 260"/>
      <path d="M 880 250 L 880 260 L 870 260"/>
    </g>

    <!-- label -->
    <text x="40" y="50" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#39d353" letter-spacing="3" opacity=".8">// FEATURED ACHIEVEMENT</text>

    <!-- title with subtle glitch (GitHub-safe) -->
    <g font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" letter-spacing="2">
      <text x="40" y="110" fill="#39d353" opacity=".35">
        GRAND FINALIST
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-2 1;2 -1;0 0;0 0" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="40" y="110" fill="#58a6ff" opacity=".35">
        GRAND FINALIST
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;2 -1;-2 1;0 0;0 0" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="40" y="110" fill="#e6edf3">GRAND FINALIST</text>
    </g>

    <!-- subtitle -->
    <text x="40" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#58a6ff">ALIBABA CLOUD AI HACKATHON PAKISTAN 2026</text>
    <text x="40" y="178" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#8b949e">ISLAMABAD  ·  WATTWISE — AI ENERGY INTELLIGENCE</text>

    <!-- tech pills -->
    <g font-family="'Courier New',monospace" font-size="11" font-weight="700">
      <rect x="40"  y="200" width="80"  height="24" rx="12" fill="#0d1117" stroke="#39d353" stroke-width="1"/>
      <text x="80"  y="216" text-anchor="middle" fill="#39d353">FASTAPI</text>
      <rect x="128" y="200" width="80"  height="24" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
      <text x="168" y="216" text-anchor="middle" fill="#58a6ff">NEXT.JS</text>
      <rect x="216" y="200" width="100" height="24" rx="12" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/>
      <text x="266" y="216" text-anchor="middle" fill="#bc8cff">ML FORECAST</text>
      <rect x="324" y="200" width="100" height="24" rx="12" fill="#0d1117" stroke="#39d353" stroke-width="1"/>
      <text x="374" y="216" text-anchor="middle" fill="#39d353">PYDANTICAI</text>
    </g>

    <!-- badge -->
    <g>
      <circle cx="780" cy="130" r="72" fill="none" stroke="#39d353" stroke-width="2" opacity=".25"/>
      <circle cx="780" cy="130" r="62" fill="#0d1117" stroke="#39d353" stroke-width="2" filter="url(#glow)">
        <animate attributeName="r" values="62;64;62" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="780" cy="130" r="52" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="0 780 130" to="360 780 130" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="780" y="124" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="800" fill="#e6edf3">TOP 300</text>
      <text x="780" y="145" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" font-weight="700" fill="#39d353">OF ~16,000</text>
      <text x="780" y="160" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" font-weight="700" fill="#39d353">PROJECTS</text>
    </g>

    <!-- scanline -->
    <rect width="900" height="2" fill="#39d353" opacity=".3">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 280" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
