<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <radialGradient id="citySky" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset=".5" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353" stop-opacity=".3"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#39d353" opacity=".1"/>
    </pattern>
  </defs>

  <!-- SKY -->
  <rect width="900" height="460" fill="url(#citySky)"/>
  <rect width="900" height="460" fill="url(#dotGrid)"/>

  <!-- STARS -->
  <g fill="#fff">
    <circle cx="50"  cy="40" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="70" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="50" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="55" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="25" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin=".8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HORIZON GLOW -->
  <ellipse cx="450" cy="330" rx="450" ry="80" fill="url(#groundFade)" opacity=".6"/>

  <!-- FAR SKYLINE (silhouette) -->
  <g fill="#0b1420" opacity=".9">
    <rect x="0"   y="230" width="70" height="140"/>
    <rect x="70"  y="190" width="50" height="180"/>
    <rect x="120" y="240" width="60" height="130"/>
    <rect x="180" y="170" width="55" height="200"/>
    <rect x="235" y="220" width="70" height="150"/>
    <rect x="305" y="150" width="60" height="220"/>
    <rect x="365" y="210" width="55" height="160"/>
    <rect x="420" y="180" width="65" height="190"/>
    <rect x="485" y="230" width="60" height="140"/>
    <rect x="545" y="160" width="55" height="210"/>
    <rect x="600" y="200" width="70" height="170"/>
    <rect x="670" y="175" width="60" height="195"/>
    <rect x="730" y="220" width="55" height="150"/>
    <rect x="785" y="190" width="60" height="180"/>
    <rect x="845" y="240" width="55" height="130"/>
  </g>

  <!-- NEAR BUILDINGS (main tech buildings) — 8 buildings aligned with tech pills -->
  <g fill="url(#bldgGrad)" stroke-width="1.5">
    <!-- 1: Python -->
    <rect x="40"  y="250" width="70" height="130" stroke="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.3s" fill="freeze"/>
    </rect>
    <!-- 2: FastAPI -->
    <rect x="145" y="210" width="70" height="170" stroke="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.7s" fill="freeze"/>
    </rect>
    <!-- 3: React -->
    <rect x="250" y="235" width="70" height="145" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1.1s" fill="freeze"/>
    </rect>
    <!-- 4: Next.js -->
    <rect x="355" y="195" width="70" height="185" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1.5s" fill="freeze"/>
    </rect>
    <!-- 5: PostgreSQL -->
    <rect x="460" y="225" width="70" height="155" stroke="#bc8cff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1.9s" fill="freeze"/>
    </rect>
    <!-- 6: Docker -->
    <rect x="565" y="245" width="70" height="135" stroke="#bc8cff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2.3s" fill="freeze"/>
    </rect>
    <!-- 7: PydanticAI -->
    <rect x="670" y="200" width="70" height="180" stroke="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2.7s" fill="freeze"/>
    </rect>
    <!-- 8: TypeScript -->
    <rect x="775" y="240" width="70" height="140" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="3.1s" fill="freeze"/>
    </rect>
  </g>

  <!-- WINDOWS on buildings (appear with building) -->
  <g fill="#39d353">
    <!-- Python building windows -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.8s" fill="freeze"/>
      <rect x="55"  y="270" width="6" height="6"/><rect x="70"  y="270" width="6" height="6"/><rect x="90"  y="270" width="6" height="6"/>
      <rect x="55"  y="290" width="6" height="6"/><rect x="90"  y="290" width="6" height="6"/>
      <rect x="55"  y="310" width="6" height="6"/><rect x="70"  y="310" width="6" height="6"/><rect x="90"  y="310" width="6" height="6"/>
    </g>
    <!-- FastAPI -->
    <g fill="#39d353" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1.2s" fill="freeze"/>
      <rect x="160" y="230" width="6" height="6"/><rect x="180" y="230" width="6" height="6"/><rect x="200" y="230" width="6" height="6"/>
      <rect x="160" y="250" width="6" height="6"/><rect x="200" y="250" width="6" height="6"/>
      <rect x="160" y="270" width="6" height="6"/><rect x="180" y="270" width="6" height="6"/><rect x="200" y="270" width="6" height="6"/>
      <rect x="160" y="290" width="6" height="6"/><rect x="180" y="290" width="6" height="6"/>
    </g>
    <!-- React -->
    <g fill="#58a6ff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1.6s" fill="freeze"/>
      <rect x="265" y="255" width="6" height="6"/><rect x="285" y="255" width="6" height="6"/><rect x="305" y="255" width="6" height="6"/>
      <rect x="265" y="275" width="6" height="6"/><rect x="305" y="275" width="6" height="6"/>
      <rect x="265" y="295" width="6" height="6"/><rect x="285" y="295" width="6" height="6"/><rect x="305" y="295" width="6" height="6"/>
    </g>
    <!-- Next.js -->
    <g fill="#58a6ff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2s" fill="freeze"/>
      <rect x="370" y="215" width="6" height="6"/><rect x="390" y="215" width="6" height="6"/><rect x="410" y="215" width="6" height="6"/>
      <rect x="370" y="235" width="6" height="6"/><rect x="410" y="235" width="6" height="6"/>
      <rect x="370" y="255" width="6" height="6"/><rect x="390" y="255" width="6" height="6"/><rect x="410" y="255" width="6" height="6"/>
      <rect x="370" y="275" width="6" height="6"/><rect x="390" y="275" width="6" height="6"/>
    </g>
    <!-- PostgreSQL -->
    <g fill="#bc8cff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2.4s" fill="freeze"/>
      <rect x="475" y="245" width="6" height="6"/><rect x="495" y="245" width="6" height="6"/><rect x="515" y="245" width="6" height="6"/>
      <rect x="475" y="265" width="6" height="6"/><rect x="515" y="265" width="6" height="6"/>
      <rect x="475" y="285" width="6" height="6"/><rect x="495" y="285" width="6" height="6"/><rect x="515" y="285" width="6" height="6"/>
    </g>
    <!-- Docker -->
    <g fill="#bc8cff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2.8s" fill="freeze"/>
      <rect x="580" y="265" width="6" height="6"/><rect x="600" y="265" width="6" height="6"/><rect x="620" y="265" width="6" height="6"/>
      <rect x="580" y="285" width="6" height="6"/><rect x="620" y="285" width="6" height="6"/>
      <rect x="580" y="305" width="6" height="6"/><rect x="600" y="305" width="6" height="6"/><rect x="620" y="305" width="6" height="6"/>
    </g>
    <!-- PydanticAI -->
    <g fill="#39d353" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="3.2s" fill="freeze"/>
      <rect x="685" y="220" width="6" height="6"/><rect x="705" y="220" width="6" height="6"/><rect x="725" y="220" width="6" height="6"/>
      <rect x="685" y="240" width="6" height="6"/><rect x="725" y="240" width="6" height="6"/>
      <rect x="685" y="260" width="6" height="6"/><rect x="705" y="260" width="6" height="6"/><rect x="725" y="260" width="6" height="6"/>
      <rect x="685" y="280" width="6" height="6"/><rect x="705" y="280" width="6" height="6"/>
    </g>
    <!-- TypeScript -->
    <g fill="#58a6ff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="3.6s" fill="freeze"/>
      <rect x="790" y="260" width="6" height="6"/><rect x="810" y="260" width="6" height="6"/><rect x="830" y="260" width="6" height="6"/>
      <rect x="790" y="280" width="6" height="6"/><rect x="830" y="280" width="6" height="6"/>
      <rect x="790" y="300" width="6" height="6"/><rect x="810" y="300" width="6" height="6"/><rect x="830" y="300" width="6" height="6"/>
    </g>
  </g>

  <!-- ANTENNAS (appear with building) -->
  <g stroke="#39d353" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.8s" fill="freeze"/>
    <line x1="75" y1="250" x2="75" y2="225"/>
    <circle cx="75" cy="223" r="2.5" fill="#39d353" filter="url(#softGlow)"/>
  </g>
  <g stroke="#58a6ff" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2s" fill="freeze"/>
    <line x1="390" y1="195" x2="390" y2="170"/>
    <circle cx="390" cy="168" r="2.5" fill="#58a6ff" filter="url(#softGlow)"/>
  </g>
  <g stroke="#bc8cff" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".5s" begin="2.8s" fill="freeze"/>
    <line x1="705" y1="200" x2="705" y2="175"/>
    <circle cx="705" cy="173" r="2.5" fill="#bc8cff" filter="url(#softGlow)"/>
  </g>

  <!-- TECH PILLS above each building (appear with building, stay) -->
  <g font-family="'Courier New',monospace" font-size="11" font-weight="700" text-anchor="middle">
    <!-- Python -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="0.5s" fill="freeze"/>
      <rect x="45"  y="195" width="60" height="22" rx="11" fill="#0d1117" stroke="#39d353" stroke-width="1.2" filter="url(#glow)"/>
      <text x="75"  y="210" fill="#39d353">PYTHON</text>
    </g>
    <!-- FastAPI -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="0.9s" fill="freeze"/>
      <rect x="145" y="155" width="70" height="22" rx="11" fill="#0d1117" stroke="#39d353" stroke-width="1.2" filter="url(#glow)"/>
      <text x="180" y="170" fill="#39d353">FASTAPI</text>
    </g>
    <!-- React -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.3s" fill="freeze"/>
      <rect x="255" y="180" width="60" height="22" rx="11" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" filter="url(#glow)"/>
      <text x="285" y="195" fill="#58a6ff">REACT</text>
    </g>
    <!-- Next.js -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.7s" fill="freeze"/>
      <rect x="355" y="140" width="70" height="22" rx="11" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" filter="url(#glow)"/>
      <text x="390" y="155" fill="#58a6ff">NEXT.JS</text>
    </g>
    <!-- PostgreSQL -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="2.1s" fill="freeze"/>
      <rect x="450" y="170" width="90" height="22" rx="11" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2" filter="url(#glow)"/>
      <text x="495" y="185" fill="#bc8cff">POSTGRESQL</text>
    </g>
    <!-- Docker -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="2.5s" fill="freeze"/>
      <rect x="565" y="190" width="60" height="22" rx="11" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2" filter="url(#glow)"/>
      <text x="595" y="205" fill="#bc8cff">DOCKER</text>
    </g>
    <!-- PydanticAI -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="2.9s" fill="freeze"/>
      <rect x="660" y="145" width="90" height="22" rx="11" fill="#0d1117" stroke="#39d353" stroke-width="1.2" filter="url(#glow)"/>
      <text x="705" y="160" fill="#39d353">PYDANTICAI</text>
    </g>
    <!-- TypeScript -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="3.3s" fill="freeze"/>
      <rect x="770" y="185" width="80" height="22" rx="11" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" filter="url(#glow)"/>
      <text x="810" y="200" fill="#58a6ff">TYPESCRIPT</text>
    </g>
  </g>

  <!-- GROUND + GRID -->
  <line x1="0" y1="380" x2="900" y2="380" stroke="#39d353" stroke-width="1.5" opacity=".6" filter="url(#softGlow)"/>
  <g stroke="#39d353" stroke-width="1" opacity=".3" fill="none">
    <line x1="0" y1="395" x2="900" y2="395" opacity=".5"/>
    <line x1="0" y1="415" x2="900" y2="415" opacity=".35"/>
    <line x1="0" y1="440" x2="900" y2="440" opacity=".2"/>
    <line x1="450" y1="380" x2="0"   y2="460"/>
    <line x1="450" y1="380" x2="150" y2="460"/>
    <line x1="450" y1="380" x2="300" y2="460"/>
    <line x1="450" y1="380" x2="450" y2="460"/>
    <line x1="450" y1="380" x2="600" y2="460"/>
    <line x1="450" y1="380" x2="750" y2="460"/>
    <line x1="450" y1="380" x2="900" y2="460"/>
  </g>

  <!-- TITLE -->
  <text x="450" y="42" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#39d353" opacity=".9" filter="url(#softGlow)">TECH ARSENAL</text>
  <text x="450" y="62" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" font-weight="600" letter-spacing="3" fill="#58a6ff" opacity=".7">// THE CITY THAT BUILDS</text>
</svg>
