<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset=".55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="1" stop-color="#39d353" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#39d353" opacity=".12"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="360" fill="url(#bgGlow)"/>
  <rect width="900" height="360" fill="url(#dotGrid)"/>

  <!-- AURORA GLOW BLOBS (behind everything) -->
  <g opacity=".55">
    <circle cx="180" cy="120" r="140" fill="#39d353" opacity=".08" filter="url(#strongGlow)">
      <animate attributeName="opacity" values=".05;.14;.05" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="90" r="160" fill="#58a6ff" opacity=".08" filter="url(#strongGlow)">
      <animate attributeName="opacity" values=".14;.05;.14" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="200" r="180" fill="#bc8cff" opacity=".06" filter="url(#strongGlow)">
      <animate attributeName="opacity" values=".06;.12;.06" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLOATING PARTICLES -->
  <g fill="#39d353">
    <circle cx="80"  cy="60" r="1.6"><animate attributeName="cy" values="60;40;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="220" r="1.4"><animate attributeName="cy" values="220;200;220" dur="7s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="1.8"><animate attributeName="cy" values="40;20;40" dur="5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="300" r="1.5"><animate attributeName="cy" values="300;280;300" dur="8s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="8s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.7"><animate attributeName="cy" values="50;30;50" dur="6.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="6.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="240" r="1.3"><animate attributeName="cy" values="240;220;240" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="80" r="1.6"><animate attributeName="cy" values="80;60;80" dur="6s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#58a6ff">
    <circle cx="240" cy="140" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="180" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="120" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="4.5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HORIZON GLOW -->
  <ellipse cx="450" cy="250" rx="420" ry="60" fill="url(#sunGrad)" opacity=".5"/>

  <!-- PERSPECTIVE GRID (synthwave floor) -->
  <g stroke="#39d353" stroke-width="1" opacity=".35" fill="none">
    <!-- horizontal lines (perspective) -->
    <line x1="0" y1="250" x2="900" y2="250" opacity=".6"/>
    <line x1="0" y1="265" x2="900" y2="265" opacity=".5"/>
    <line x1="0" y1="285" x2="900" y2="285" opacity=".4"/>
    <line x1="0" y1="310" x2="900" y2="310" opacity=".3"/>
    <line x1="0" y1="340" x2="900" y2="340" opacity=".2"/>
    <!-- vertical lines (converging to center) -->
    <line x1="450" y1="250" x2="0"   y2="360"/>
    <line x1="450" y1="250" x2="150" y2="360"/>
    <line x1="450" y1="250" x2="300" y2="360"/>
    <line x1="450" y1="250" x2="450" y2="360"/>
    <line x1="450" y1="250" x2="600" y2="360"/>
    <line x1="450" y1="250" x2="750" y2="360"/>
    <line x1="450" y1="250" x2="900" y2="360"/>
  </g>

  <!-- GRID PULSE (animated scanline across grid) -->
  <rect x="0" y="250" width="900" height="2" fill="#39d353" opacity=".6" filter="url(#softGlow)">
    <animate attributeName="y" values="250;360;250" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;0;.6" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- BUILDINGS (dark silhouette with neon edge) -->
  <g>
    <!-- far layer -->
    <g fill="#0b1420" opacity=".9">
      <rect x="40"  y="170" width="60" height="80"/>
      <rect x="120" y="140" width="50" height="110"/>
      <rect x="200" y="160" width="70" height="90"/>
      <rect x="290" y="120" width="45" height="130"/>
      <rect x="360" y="150" width="60" height="100"/>
      <rect x="480" y="130" width="55" height="120"/>
      <rect x="560" y="160" width="70" height="90"/>
      <rect x="650" y="140" width="50" height="110"/>
      <rect x="720" y="165" width="65" height="85"/>
      <rect x="800" y="145" width="55" height="105"/>
    </g>
    <!-- near layer with neon top edges -->
    <g fill="#0d1117" stroke-width="1.5">
      <rect x="70"  y="200" width="55" height="50" stroke="#39d353"/>
      <rect x="230" y="185" width="60" height="65" stroke="#58a6ff"/>
      <rect x="400" y="175" width="50" height="75" stroke="#bc8cff"/>
      <rect x="530" y="190" width="65" height="60" stroke="#39d353"/>
      <rect x="700" y="195" width="55" height="55" stroke="#58a6ff"/>
    </g>
    <!-- window dots (blinking) -->
    <g fill="#39d353">
      <circle cx="85"  cy="215" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="230" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="200" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="265" cy="220" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="415" cy="195" r="1.5" fill="#bc8cff"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="425" cy="215" r="1.5" fill="#bc8cff"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="550" cy="210" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="225" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="715" cy="210" r="1.5" fill="#58a6ff"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="735" cy="230" r="1.5" fill="#58a6ff"><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin=".3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- NAME + ROLE (top, clear) -->
  <text x="450" y="70" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="38" font-weight="800" letter-spacing="1" fill="url(#nameGrad)" filter="url(#softGlow)">
    Hey, I'm Syed Taha Manzar
  </text>
  <text x="450" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#58a6ff" opacity=".9">
    ASPIRING FULL-STACK AI ENGINEER
    <animate attributeName="opacity" values=".9;.5;.9" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- UNDERLINE ACCENT (animated width) -->
  <rect x="300" y="122" width="300" height="2" fill="#39d353" filter="url(#softGlow)">
    <animate attributeName="width" values="0;300;300;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;300;300;450" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- FLOATING TECH TAGS (subtle, sides) -->
  <g font-family="'Courier New',monospace" font-size="11" font-weight="700">
    <text x="60"  y="145" fill="#39d353" opacity=".7">[ FastAPI ]<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="70"  y="175" fill="#58a6ff" opacity=".6">[ RAG ]<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s" begin="1s" repeatCount="indefinite"/></text>
    <text x="800" y="145" fill="#bc8cff" opacity=".7" text-anchor="end">[ Next.js ]<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6.5s" begin=".5s" repeatCount="indefinite"/></text>
    <text x="800" y="175" fill="#39d353" opacity=".6" text-anchor="end">[ PydanticAI ]<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7.5s" begin="2s" repeatCount="indefinite"/></text>
  </g>
</svg>
