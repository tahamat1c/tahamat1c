<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset=".6" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39d353"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- SUBTLE PARTICLE DOTS -->
  <g fill="#ffffff" opacity=".15">
    <circle cx="80"  cy="50"  r="1.2"><animate attributeName="opacity" values=".05;.25;.05" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="230" r="1"><animate attributeName="opacity" values=".05;.2;.05" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70"  r="1.2"><animate attributeName="opacity" values=".05;.25;.05" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="250" r="1"><animate attributeName="opacity" values=".05;.2;.05" dur="6.5s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="60"  r="1.2"><animate attributeName="opacity" values=".05;.25;.05" dur="5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="220" r="1"><animate attributeName="opacity" values=".05;.2;.05" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- TOP ACCENT LINE -->
  <rect x="350" y="52" width="200" height="2" fill="url(#accent)" opacity=".8"/>

  <!-- SMALL LABEL -->
  <text x="450" y="88" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#8b949e">WELCOME TO MY PROFILE</text>

  <!-- NAME -->
  <text x="450" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#ffffff">Syed Taha Manzar</text>

  <!-- ROLE -->
  <text x="450" y="192" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="500" letter-spacing="1" fill="#39d353" opacity=".95">
    Aspiring Full-Stack AI Engineer
    <animate attributeName="opacity" values=".95;.6;.95" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- BOTTOM ACCENT LINE (animated width) -->
  <rect x="450" y="222" width="0" height="1.5" fill="#39d353" opacity=".6">
    <animate attributeName="width" from="0" to="280" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" from="450" to="310" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- TAGLINE -->
  <text x="450" y="258" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" letter-spacing=".5" fill="#8b949e" opacity=".85">Building intelligent systems · RAG · FastAPI · Full-Stack</text>
</svg>
