name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tahamat1c
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39D353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-light.svg?palette=github-light&color_snake=#39D353&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
